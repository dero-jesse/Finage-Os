<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finage OS v3 - Integrated SACCO / MFI Cash Flow & Liquidity Management System</title>
  <meta name="description"
    content="Orbit-R-grade Core Banking Foundation, Relationship Information Management (RIM), Real-Time GL, Embedded Workflow Pacing, and SASRA/CBK Compliance.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Finage OS Clean Design System Styles -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">

  <style>
    :root {
      --shell-bg: #eef4ff;
      --shell-surface: rgba(255, 255, 255, 0.8);
      --shell-border: rgba(148, 163, 184, 0.22);
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- Top Navigation Header -->
    <header class="top-header">
      <div class="brand-section">
        <button id="btn-open-portal-nav" class="header-btn icon-btn" type="button" aria-label="Open portal navigation">☰</button>
        <img src="images/logo.png" alt="Finage OS Logo" style="height: 34px; width: auto; object-fit: contain;">
        <div class="brand-lockup">
          <div class="brand-title" id="brand-title-display">FINAGE OS</div>
          <div class="brand-organization" id="organization-title-display">Select organization</div>
        </div>
      </div>

      <!-- Role Access Switcher (Layer 9 Multi-Persona) -->
      <nav class="role-nav" aria-label="Role View Switcher">
        <button class="role-btn" data-role="teller"
          title="Teller counter operations, member cash desk, deposits, withdrawals, and teller desk activity">
          Teller
        </button>

        <button class="role-btn" data-role="front-office"
          title="FOSA branch supervision, teller audit, and counter oversight">
          FOSA
        </button>

        <button class="role-btn active" data-role="treasury"
          title="Real-time multi-ledger GL, channel liquidity, maturity ladder">
          Treasury
        </button>

        <button class="role-btn" data-role="credit"
          title="Maker-Checker workflow inbox, Online NPA classification, Pacing engine">
          Credit
        </button>

        <button class="role-btn" data-role="board"
          title="Executive governance dashboard, system audit logs, and SASRA returns">
          Board
        </button>
      </nav>

      <div class="header-actions">
        <button id="btn-global-alerts" class="header-btn ghost-btn" type="button" aria-label="System alerts">Alerts</button>
        <button id="sync-status-badge" class="header-btn sync-badge" title="Database Sync Protocol: Local cache synced with Supabase (Click to pull/push immediately)" type="button">
          Synced
        </button>

        <div id="active-user-badge" class="active-user-badge" title="Current active operator context">
          <!-- Populated dynamically -->
        </div>

        <button id="btn-open-actions" class="header-btn" type="button" aria-label="Open actions menu">Actions ▾</button>
      </div>
    </header>

    <aside id="portal-nav-drawer" class="portal-drawer" aria-hidden="true">
      <div class="drawer-header">
        <div>
          <div class="drawer-kicker">Portals</div>
          <h2>FINAGE OS</h2>
        </div>
        <button class="drawer-close" type="button" data-close-drawer="portal">Close</button>
      </div>
      <div class="drawer-body">
        <div id="portal-drawer-list" class="drawer-stack"></div>
      </div>
    </aside>

    <aside id="utility-menu-drawer" class="portal-drawer portal-drawer--utility" aria-hidden="true">
      <div class="drawer-header">
        <div>
          <div class="drawer-kicker">Workspace</div>
          <h2>Actions</h2>
        </div>
        <button class="drawer-close" type="button" data-close-drawer="utility">Close</button>
      </div>
      <div class="drawer-body">
        <div id="utility-menu-list" class="drawer-stack"></div>
      </div>
    </aside>

    <!-- Institutional Liquidity & Compliance Ticker Bar -->
    <section id="liquidity-ticker-bar" class="liquidity-ticker-bar" aria-label="Real-time Financial Ticker">
      <!-- Injected dynamically by App.js -->
    </section>

    <!-- Main Viewport for Role-Based Views -->
    <main id="main-viewport" class="main-viewport">
      <!-- Active View Component Injected Here -->
    </main>

    <!-- Modals & Widgets Layer -->
    <div id="input-modal-mount"></div>
    <div id="user-mgmt-mount"></div>
    <div id="reports-modal-mount"></div>
    <div id="ai-widget-mount"></div>
    <div id="client-selection-modal-mount"></div>
    <div id="org-setup-mount"></div>

    <!-- Toast Shelf Container -->
    <div id="toast-shelf" class="toast-shelf" aria-live="polite"></div>
  </div>

  <!-- JavaScript Utilities & Services -->
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/chartManager.js"></script>
  <script src="js/utils/exportService.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/utils/setupImport.js"></script>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sync/supabaseSync.js"></script>

  <!-- Core Engines (Layers 0, 0.5, 1, 2, 3, 4, 5, 7) -->
  <script src="js/engine/coreBankingEngine.js"></script>

  <script src="js/engine/rimEngine.js"></script>
  <script src="js/engine/workflowEngine.js"></script>
  <script src="js/engine/cashEngine.js"></script>
  <script src="js/engine/forecastEngine.js"></script>
  <script src="js/engine/portfolioEngine.js"></script>
  <script src="js/engine/pacingEngine.js"></script>
  <script src="js/engine/stressTestEngine.js"></script>
  <script src="js/engine/auditService.js"></script>
  <script src="js/engine/userManagementEngine.js"></script>
  <script src="js/engine/aiAgentEngine.js"></script>

  <!-- Role-Based Views (Layer 9) -->
  <script src="js/views/landingView.js"></script>
  <script src="js/views/loginView.js"></script>
  <script src="js/views/inputModalView.js"></script>
  <script src="js/views/userManagementView.js"></script>
  <script src="js/views/reportsView.js"></script>
  <script src="js/views/aiWidgetView.js"></script>
  <script src="js/views/clientSelectionModalView.js"></script>
  <script src="js/views/memberPortalView.js"></script>
  <script src="js/views/branchView.js"></script>
  <script src="js/views/treasuryView.js"></script>
  <script src="js/views/creditView.js"></script>
  <script src="js/views/boardView.js"></script>

  <!-- Application Bootstrap -->
  <script src="js/platform.js"></script>
  <script src="js/views/orgSelectorView.js"></script>
  <script src="js/views/setupWizardView.js"></script>
  <script src="js/views/organizationSetupView.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
